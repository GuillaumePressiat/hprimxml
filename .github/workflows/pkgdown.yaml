# Construit le site pkgdown et le publie sur GitHub Pages à chaque push sur main.
# Prérequis (une fois) : Settings > Pages > Source : « GitHub Actions ».
name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::knitr, local::.
      # Le README est régénéré ici à partir de README.Rmd (qui exécute inst/exemples/) :
      # le site publié est donc toujours à jour, quelle que soit la version commitée.
      # Un écart avec le README.md commité est seulement signalé : la mise en forme produite
      # par knitr varie selon sa version (ex. « ```r » ou « ``` r »), pas le contenu.
      - name: README régénéré depuis README.Rmd
        run: |
          Rscript -e 'knitr::knit("README.Rmd", "README.md", quiet = TRUE)'
          if ! git diff --quiet README.md; then
            echo "::warning file=README.md::README.md commité différent du README régénéré : lancer knitr::knit('README.Rmd') et committer (écarts de contenu ou de mise en forme selon la version de knitr)."
            git diff --stat README.md
          fi
      - name: Construction du site
        run: Rscript -e 'pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
